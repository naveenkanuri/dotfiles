# Performance-optimized golangci-lint config
run:
  timeout: 5m
  tests: false
  skip-dirs:
    - vendor
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"

linters-settings:
  govet:
    enable-all: false
    enable:
      - assign
      - atomic
      - bool
      - buildtag
      - errorsas
      - ifaceassert
      - nilfunc
      - printf
      - stringintconv
  
  golint:
    min-confidence: 0.8
  
  gofumpt:
    extra-rules: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofumpt
    - goimports
  disable:
    - deadcode      # deprecated
    - structcheck   # deprecated  
    - varcheck      # deprecated
    - scopelint     # deprecated
    - exhaustivestruct  # too noisy
    - forbidigo     # too restrictive
    - gochecknoglobals  # too restrictive

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-use-default: false

